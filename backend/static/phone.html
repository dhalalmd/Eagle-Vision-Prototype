<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart Border — Phone Camera</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden;background:#000;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    body{display:flex;flex-direction:column;position:relative}

    /* ----- TOP BAR ----- */
    .top-bar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;
      align-items:center;justify-content:space-between;padding:12px 16px;
      background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,transparent 100%)}
    .cam-name{font-size:.85rem;font-weight:600;color:#e2e8f0;max-width:50%;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .live-badge{display:flex;align-items:center;gap:6px;background:rgba(239,68,68,.9);
      padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.5px}
    .live-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse-dot 1.2s infinite}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
    .conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .conn-dot.ok{background:#22c55e}.conn-dot.warn{background:#f59e0b}.conn-dot.bad{background:#ef4444}

    /* ----- PREVIEW ----- */
    .preview-wrap{flex:1;display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;background:#000}
    video{width:100%;height:100%;object-fit:cover}
    video.mirror{transform:scaleX(-1)}
    canvas{display:none}
    .grid-overlay{position:absolute;inset:0;pointer-events:none;display:none}
    .grid-overlay.show{display:block}
    .grid-overlay line{stroke:rgba(255,255,255,.18);stroke-width:1}
    .off-screen{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:#000;z-index:10}
    .off-screen .icon{width:64px;height:64px;border-radius:50%;background:#1e293b;
      display:flex;align-items:center;justify-content:center;margin-bottom:16px}
    .off-screen .icon svg{width:28px;height:28px;fill:none;stroke:#64748b;stroke-width:2}
    .off-screen p{color:#64748b;font-size:.85rem}

    /* ----- STATS LINE ----- */
    .stats-line{position:absolute;bottom:100px;left:0;right:0;text-align:center;
      font-size:.65rem;color:rgba(255,255,255,.5);z-index:15;pointer-events:none}

    /* ----- BOTTOM CONTROLS ----- */
    .bottom-bar{position:absolute;bottom:0;left:0;right:0;z-index:20;
      padding:14px 12px 24px;display:flex;align-items:center;justify-content:space-around;
      background:linear-gradient(0deg,rgba(0,0,0,.75) 0%,transparent 100%)}
    .ctrl-btn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.12);
      color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:background .15s}
    .ctrl-btn:active{background:rgba(255,255,255,.25)}
    .ctrl-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ctrl-btn.active{background:rgba(56,189,248,.3);color:#38bdf8}
    .big-btn{width:68px;height:68px;border-radius:50%;border:4px solid #fff;
      background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:all .2s;position:relative}
    .big-btn.recording{background:#ef4444;border-color:#ef4444}
    .big-btn .inner{width:24px;height:24px;border-radius:50%;background:#fff;transition:all .2s}
    .big-btn.recording .inner{border-radius:4px;width:22px;height:22px;background:#fff}

    /* ----- SETTINGS SHEET ----- */
    .settings-overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.6)}
    .settings-overlay.show{display:flex;align-items:flex-end;justify-content:center}
    .settings-sheet{width:100%;max-width:420px;max-height:70vh;overflow-y:auto;
      background:#1e293b;border-radius:16px 16px 0 0;padding:20px 20px 32px;color:#e2e8f0}
    .settings-sheet h3{font-size:.95rem;font-weight:700;margin-bottom:16px;
      display:flex;align-items:center;justify-content:space-between}
    .settings-sheet h3 button{background:none;border:none;color:#94a3b8;font-size:1.2rem;cursor:pointer}
    .s-group{margin-bottom:14px}
    .s-label{font-size:.7rem;color:#94a3b8;font-weight:600;text-transform:uppercase;
      letter-spacing:.5px;margin-bottom:6px}
    .s-row{display:flex;gap:6px;flex-wrap:wrap}
    .s-chip{padding:6px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;
      color:#94a3b8;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s}
    .s-chip.active{background:#0284c7;border-color:#0284c7;color:#fff}
    .s-range{width:100%;accent-color:#0284c7}
    .s-toggle{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
    .s-toggle label{font-size:.8rem;color:#cbd5e1}
    .switch{position:relative;width:40px;height:22px}
    .switch input{opacity:0;width:0;height:0}
    .switch .slider{position:absolute;inset:0;background:#334155;border-radius:12px;cursor:pointer;transition:.2s}
    .switch .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;bottom:3px;
      background:#fff;border-radius:50%;transition:.2s}
    .switch input:checked+.slider{background:#0284c7}
    .switch input:checked+.slider:before{transform:translateX(18px)}
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar" id="topBar">
  <div style="display:flex;align-items:center;gap:8px">
    <span class="conn-dot warn" id="connDot"></span>
    <span class="cam-name" id="camName">Camera</span>
  </div>
  <div class="live-badge" id="liveBadge" style="display:none">
    <span class="live-dot"></span>
    <span>LIVE</span>
    <span id="liveTimer">00:00</span>
  </div>
</div>

<!-- PREVIEW -->
<div class="preview-wrap">
  <video id="preview" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <svg class="grid-overlay" id="gridOverlay" viewBox="0 0 300 300" preserveAspectRatio="none">
    <line x1="100" y1="0" x2="100" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="0" y1="100" x2="300" y2="100"/><line x1="0" y1="200" x2="300" y2="200"/>
  </svg>
  <div class="off-screen" id="offScreen" style="display:none">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M1 1l22 22M21 21H3a2 2 0 01-2-2V5a2 2 0 012-2h3l2-3h8l2 3h3a2 2 0 012 2v10"/><circle cx="12" cy="12" r="4"/></svg></div>
    <p>Camera off</p>
  </div>
</div>

<!-- STATS -->
<div class="stats-line" id="statsLine">FPS: 0 &nbsp;|&nbsp; Ping: — ms</div>

<!-- BOTTOM CONTROLS -->
<div class="bottom-bar" id="bottomBar">
  <!-- flip -->
  <button class="ctrl-btn" id="btnFlip" title="Switch Camera">
    <svg viewBox="0 0 24 24"><path d="M16 3h5v5M8 21H3v-5"/><path d="M21 3l-7 7M3 21l7-7"/></svg>
  </button>
  <!-- torch -->
  <button class="ctrl-btn" id="btnTorch" title="Torch" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
  </button>
  <!-- BIG START/STOP -->
  <button class="big-btn" id="btnToggle"><div class="inner"></div></button>
  <!-- snapshot -->
  <button class="ctrl-btn" id="btnSnap" title="Snapshot">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M5 7h2l2-3h6l2 3h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9a2 2 0 012-2z"/></svg>
  </button>
  <!-- grid -->
  <button class="ctrl-btn" id="btnGrid" title="Grid Lines">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
  </button>
  <!-- mirror -->
  <button class="ctrl-btn" id="btnMirror" title="Mirror Preview">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M16 7l4 5-4 5M8 7L4 12l4 5"/></svg>
  </button>
  <!-- settings -->
  <button class="ctrl-btn" id="btnSettings" title="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1.08 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001.08 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1.08z"/></svg>
  </button>
</div>

<!-- SETTINGS SHEET -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-sheet">
    <h3>Settings <button id="closeSettings">&times;</button></h3>

    <div class="s-group">
      <div class="s-label">Resolution</div>
      <div class="s-row" id="resRow">
        <button class="s-chip" data-w="320" data-h="240">320×240</button>
        <button class="s-chip active" data-w="640" data-h="480">640×480</button>
        <button class="s-chip" data-w="1280" data-h="720">1280×720</button>
      </div>
    </div>

    <div class="s-group">
      <div class="s-label">FPS</div>
      <div class="s-row" id="fpsRow">
        <button class="s-chip" data-fps="15">15</button>
        <button class="s-chip active" data-fps="24">24</button>
        <button class="s-chip" data-fps="30">30</button>
      </div>
    </div>

    <div class="s-group">
      <div class="s-label">JPEG Quality: <span id="qualVal">60</span>%</div>
      <input type="range" class="s-range" id="qualSlider" min="30" max="90" value="60" step="5"/>
    </div>

    <div class="s-group">
      <div class="s-label">Zoom</div>
      <input type="range" class="s-range" id="zoomSlider" min="1" max="3" value="1" step="0.1"/>
    </div>

    <div class="s-group">
      <div class="s-toggle">
        <label>Keep screen on</label>
        <label class="switch"><input type="checkbox" id="wakeLockToggle" checked/><span class="slider"></span></label>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- State ----
  const params = new URLSearchParams(location.search);
  const camId = params.get('cam') || 'cam_phone';
  let isStreaming = false;
  let facingMode = 'environment';
  let mirrorPreview = false;
  let gridOn = false;
  let torchOn = false;
  let stream = null;
  let ws = null;
  let sendTimer = null;
  let frameCount = 0;
  let lastFpsCalc = performance.now();
  let displayFps = 0;
  let pingMs = null;
  let liveStartTime = 0;
  let liveTimerInterval = null;
  let wakeLockSentinel = null;

  // Settings with defaults
  let cfg = {resW:640, resH:480, fps:24, quality:0.6, zoom:1};
  try { const s = localStorage.getItem('phone_cfg_'+camId); if(s) Object.assign(cfg,JSON.parse(s)); } catch(e){}

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const video = $('preview'), canvas = $('canvas'), ctx2d = canvas.getContext('2d');
  const camNameEl = $('camName'), liveBadge = $('liveBadge'), liveTimerEl = $('liveTimer');
  const connDot = $('connDot'), offScreen = $('offScreen'), statsLine = $('statsLine');
  const gridOverlay = $('gridOverlay');

  camNameEl.textContent = camId;

  // ---- Settings UI sync ----
  function syncSettingsUI(){
    document.querySelectorAll('#resRow .s-chip').forEach(b=>{
      b.classList.toggle('active', +b.dataset.w===cfg.resW && +b.dataset.h===cfg.resH);
    });
    document.querySelectorAll('#fpsRow .s-chip').forEach(b=>{
      b.classList.toggle('active', +b.dataset.fps===cfg.fps);
    });
    $('qualSlider').value = Math.round(cfg.quality*100);
    $('qualVal').textContent = Math.round(cfg.quality*100);
    $('zoomSlider').value = cfg.zoom;
  }
  syncSettingsUI();

  function saveCfg(){ try{localStorage.setItem('phone_cfg_'+camId,JSON.stringify(cfg))}catch(e){} }

  // Resolution chips
  $('resRow').addEventListener('click',e=>{
    const b=e.target.closest('.s-chip'); if(!b)return;
    cfg.resW=+b.dataset.w; cfg.resH=+b.dataset.h; saveCfg(); syncSettingsUI();
    if(isStreaming) restartCamera();
  });
  // FPS chips
  $('fpsRow').addEventListener('click',e=>{
    const b=e.target.closest('.s-chip'); if(!b)return;
    cfg.fps=+b.dataset.fps; saveCfg(); syncSettingsUI();
    if(isStreaming) restartSendLoop();
  });
  // Quality slider
  $('qualSlider').addEventListener('input',e=>{
    cfg.quality=+e.target.value/100; $('qualVal').textContent=e.target.value; saveCfg();
  });
  // Zoom slider
  $('zoomSlider').addEventListener('input',e=>{ cfg.zoom=+e.target.value; saveCfg(); });

  // Settings open/close
  $('btnSettings').addEventListener('click',()=> $('settingsOverlay').classList.add('show'));
  $('closeSettings').addEventListener('click',()=> $('settingsOverlay').classList.remove('show'));
  $('settingsOverlay').addEventListener('click',e=>{
    if(e.target===$('settingsOverlay')) $('settingsOverlay').classList.remove('show');
  });

  // ---- Wake Lock ----
  async function acquireWakeLock(){
    if(!('wakeLock' in navigator)) return;
    try{ wakeLockSentinel = await navigator.wakeLock.request('screen'); }catch(e){}
  }
  async function releaseWakeLock(){
    if(wakeLockSentinel){ try{await wakeLockSentinel.release()}catch(e){} wakeLockSentinel=null; }
  }
  $('wakeLockToggle').addEventListener('change',e=>{
    if(e.target.checked) acquireWakeLock(); else releaseWakeLock();
  });
  acquireWakeLock();
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && $('wakeLockToggle').checked) acquireWakeLock();
  });

  // ---- Camera ----
  async function startCamera(){
    if(stream) stream.getTracks().forEach(t=>t.stop());
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode, width:{ideal:cfg.resW}, height:{ideal:cfg.resH}, frameRate:{ideal:cfg.fps}},
        audio:false
      });
      video.srcObject = stream;
      offScreen.style.display='none';
      checkTorchSupport();
    }catch(err){
      console.error('Camera error:',err);
      offScreen.querySelector('p').textContent='Camera access denied';
      offScreen.style.display='flex';
    }
  }
  function stopCamera(){
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    video.srcObject=null;
  }
  function restartCamera(){ if(isStreaming){ stopCamera(); startCamera(); } }

  // ---- Torch ----
  function checkTorchSupport(){
    if(!stream) return;
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('btnTorch').style.display = caps.torch ? '' : 'none';
  }
  async function toggleTorch(){
    if(!stream) return;
    torchOn = !torchOn;
    const track = stream.getVideoTracks()[0];
    try{ await track.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ torchOn=false; }
    $('btnTorch').classList.toggle('active', torchOn);
  }
  $('btnTorch').addEventListener('click', toggleTorch);

  // ---- WebSocket ----
  function connectWS(){
    const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/phone/${camId}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = ()=>{
      connDot.className='conn-dot ok';
      if(isStreaming) try{ws.send('on')}catch(e){}
    };
    ws.onclose = ()=>{
      connDot.className='conn-dot warn';
      setTimeout(connectWS, 2000);
    };
    ws.onerror = ()=> ws.close();
    ws.onmessage = e=>{
      if(typeof e.data==='string' && e.data.startsWith('pong:')){
        pingMs = Date.now() - parseInt(e.data.slice(5),10);
      }
    };
  }
  connectWS();

  // Ping every 3s
  setInterval(()=>{
    if(ws && ws.readyState===1) try{ws.send('ping:'+Date.now())}catch(e){}
  }, 3000);

  // ---- Frame send loop ----
  function startSendLoop(){
    if(sendTimer) clearInterval(sendTimer);
    const interval = Math.round(1000/cfg.fps);
    sendTimer = setInterval(()=>{
      if(!ws || ws.readyState!==1 || !isStreaming) return;
      if(ws.bufferedAmount > 100*1024) return; // skip if backed up
      if(video.readyState<2) return;

      const vw = video.videoWidth || cfg.resW;
      const vh = video.videoHeight || cfg.resH;
      // Apply zoom via canvas crop
      const z = cfg.zoom;
      const cropW = vw/z, cropH = vh/z;
      const sx = (vw-cropW)/2, sy = (vh-cropH)/2;
      canvas.width = cfg.resW; canvas.height = cfg.resH;
      ctx2d.drawImage(video, sx, sy, cropW, cropH, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob=>{
        if(!blob || !ws || ws.readyState!==1) return;
        blob.arrayBuffer().then(buf=>{
          ws.send(buf);
          frameCount++;
          const now = performance.now();
          if(now-lastFpsCalc>=1000){
            displayFps = Math.round(frameCount*1000/(now-lastFpsCalc));
            frameCount=0; lastFpsCalc=now;
          }
        });
      }, 'image/jpeg', cfg.quality);
    }, interval);
  }
  function stopSendLoop(){ if(sendTimer){clearInterval(sendTimer);sendTimer=null;} }
  function restartSendLoop(){ if(isStreaming){stopSendLoop();startSendLoop();} }

  // ---- Live timer ----
  function startLiveTimer(){
    liveStartTime = Date.now();
    liveBadge.style.display='flex';
    liveTimerInterval = setInterval(()=>{
      const s = Math.floor((Date.now()-liveStartTime)/1000);
      const mm = String(Math.floor(s/60)).padStart(2,'0');
      const ss = String(s%60).padStart(2,'0');
      liveTimerEl.textContent = mm+':'+ss;
    },1000);
  }
  function stopLiveTimer(){
    if(liveTimerInterval){clearInterval(liveTimerInterval);liveTimerInterval=null;}
    liveBadge.style.display='none';
    liveTimerEl.textContent='00:00';
  }

  // ---- Stats ----
  setInterval(()=>{
    const pStr = pingMs!==null ? pingMs+'ms' : '—';
    statsLine.textContent = `FPS: ${displayFps}  |  Ping: ${pStr}`;
  }, 500);

  // ---- Toggle ON/OFF ----
  const btnToggle = $('btnToggle');
  function goLive(){
    isStreaming = true;
    btnToggle.classList.add('recording');
    offScreen.style.display='none';
    startCamera().then(()=>{ startSendLoop(); startLiveTimer(); });
    if(ws && ws.readyState===1) try{ws.send('on')}catch(e){}
  }
  function goOff(){
    isStreaming = false;
    btnToggle.classList.remove('recording');
    stopSendLoop(); stopLiveTimer(); stopCamera();
    offScreen.style.display='flex';
    offScreen.querySelector('p').textContent='Camera off';
    displayFps=0;
    if(ws && ws.readyState===1) try{ws.send('off')}catch(e){}
  }
  btnToggle.addEventListener('click',()=>{ isStreaming ? goOff() : goLive(); });

  // Start live automatically
  goLive();

  // ---- Flip ----
  $('btnFlip').addEventListener('click',()=>{
    facingMode = facingMode==='environment' ? 'user' : 'environment';
    torchOn=false; $('btnTorch').classList.remove('active');
    restartCamera();
  });

  // ---- Snapshot ----
  $('btnSnap').addEventListener('click',()=>{
    if(!stream) return;
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video,0,0);
    const a = document.createElement('a');
    a.href = c.toDataURL('image/jpeg',0.92);
    a.download = `snapshot_${camId}_${Date.now()}.jpg`;
    a.click();
  });

  // ---- Grid ----
  $('btnGrid').addEventListener('click',()=>{
    gridOn=!gridOn;
    gridOverlay.classList.toggle('show',gridOn);
    $('btnGrid').classList.toggle('active',gridOn);
  });

  // ---- Mirror ----
  $('btnMirror').addEventListener('click',()=>{
    mirrorPreview=!mirrorPreview;
    video.classList.toggle('mirror',mirrorPreview);
    $('btnMirror').classList.toggle('active',mirrorPreview);
  });

  // ---- Hide UI / Fullscreen ----
  let uiHidden = false;
  video.addEventListener('click',()=>{
    uiHidden = !uiHidden;
    $('topBar').style.display = uiHidden ? 'none' : '';
    $('bottomBar').style.display = uiHidden ? 'none' : '';
    statsLine.style.display = uiHidden ? 'none' : '';
    if(document.fullscreenElement){
      document.exitFullscreen().catch(()=>{});
    } else {
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  });
})();
</script>
</body>
</html>
