<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart Border CCTV - Phone Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    h1 { font-size: 1.1rem; font-weight: 600; color: #38bdf8; }
    .status-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }
    .status-badge.online { background: #15803d; color: #dcfce7; }
    .status-badge.connecting { background: #b45309; color: #fef3c7; }
    .status-badge.offline { background: #b91c1c; color: #fee2e2; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }
    video, canvas {
      width: 100%;
      max-height: calc(100vh - 120px);
      object-fit: contain;
    }
    canvas { display: none; }

    footer {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #334155;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn:active { background: #0369a1; }
    .stats { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>Camera: <span id="cam-id-display">...</span></h1>
    <div id="status" class="status-badge connecting">Connecting...</div>
  </header>

  <main>
    <video id="preview" autoplay playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
  </main>

  <footer>
    <button class="btn" id="flip-btn">Flip Camera</button>
    <div class="stats">
      FPS: <span id="fps-counter">0</span> | Buffer: <span id="buf-size">0 KB</span>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const camId = urlParams.get('cam') || 'cam_phone';
    document.getElementById('cam-id-display').textContent = camId;

    const video = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const fpsEl = document.getElementById('fps-counter');
    const bufEl = document.getElementById('buf-size');
    const flipBtn = document.getElementById('flip-btn');

    let facingMode = 'environment';
    let ws = null;
    let stream = null;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let sendInterval = null;

    // Request Screen Wake Lock
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock error:', err);
      }
    }
    requestWakeLock();

    async function initCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facingMode,
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 25 }
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('Camera access denied or unavailable: ' + err.message);
        statusEl.textContent = 'Camera Error';
        statusEl.className = 'status-badge offline';
      }
    }

    flipBtn.addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      initCamera();
    });

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/phone/${camId}`;

      statusEl.textContent = 'Connecting...';
      statusEl.className = 'status-badge connecting';

      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        statusEl.textContent = 'Streaming Live';
        statusEl.className = 'status-badge online';
        startStreaming();
      };

      ws.onclose = () => {
        statusEl.textContent = 'Reconnecting...';
        statusEl.className = 'status-badge connecting';
        stopStreaming();
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = (err) => {
        console.error('WebSocket Error:', err);
        ws.close();
      };
    }

    function startStreaming() {
      if (sendInterval) clearInterval(sendInterval);

      sendInterval = setInterval(() => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        // Skip frame if socket buffer is backed up > 100 KB (Low latency rule)
        const buffered = ws.bufferedAmount;
        bufEl.textContent = Math.round(buffered / 1024) + ' KB';
        if (buffered > 100 * 1024) {
          return;
        }

        if (video.readyState >= 2) {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          canvas.toBlob((blob) => {
            if (blob && ws && ws.readyState === WebSocket.OPEN) {
              blob.arrayBuffer().then((buf) => {
                ws.send(buf);
                frameCount++;
                const now = performance.now();
                if (now - lastFpsTime >= 1000) {
                  fpsEl.textContent = Math.round((frameCount * 1000) / (now - lastFpsTime));
                  frameCount = 0;
                  lastFpsTime = now;
                }
              });
            }
          }, 'image/jpeg', 0.6);
        }
      }, 40); // ~25 FPS
    }

    function stopStreaming() {
      if (sendInterval) clearInterval(sendInterval);
    }

    initCamera();
    connectWebSocket();
  </script>
</body>
</html>
